services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: iot_php
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    networks:
      - iot

  nginx:
    image: nginx:1.27-alpine
    container_name: iot_nginx
    depends_on:
      - php
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iot.rule=Host(`iot.localhost`)"
      - "traefik.http.services.iot.loadbalancer.server.port=80"
    networks:
      - iot

  mariadb:
    image: mariadb:11.4
    container_name: iot_mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - iot

  adminer:
    image: adminer:latest
    container_name: iot_adminer
    depends_on:
      - mariadb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.iot.localhost`)"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
    networks:
      - iot

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    networks:
      - iot

  mqtt-simulator:
    build:
      context: ./docker/simulator
    container_name: iot_mqtt_simulator
    depends_on:
      - mosquitto
      - mariadb
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - iot

  traefik:
    image: traefik:v3.6.2
    container_name: iot_traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - iot

networks:
  iot:
    name: iot_network

volumes:
  mariadb_data: